# --- JVM / daemon sizing -------------------------------------------------
# Tuned for an 8 GB machine: the Gradle daemon and the Kotlin compile daemon
# are separate processes, so they are capped independently. The previous
# 2048m cap was crashing with OutOfMemoryError (it left an 800 MB .hprof
# heap dump in the project root).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m

# --- Build speed ---------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# --- Android -------------------------------------------------------------
android.useAndroidX=true
# Jetifier was on and rewrites every dependency on each sync. Nothing in this
# project uses old support-library artifacts, so it is off (large sync win).
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# --- Kotlin --------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
